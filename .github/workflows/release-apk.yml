# 每次更新 main 都构建固定签名的三 ABI APK；版本 tag 额外发布 GitHub Release。
name: Build signed APKs

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Collector source
        uses: actions/checkout@v4
        with:
          path: m3u8-ad-audio-collector

      - name: Checkout pinned Probe source
        uses: actions/checkout@v4
        with:
          repository: 0o755/m3u8-ad-audio-probe
          ref: c2542e74982c09605be16e0eb9dec556b212783a
          path: m3u8-ad-audio-probe

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            m3u8-ad-audio-collector/**/*.gradle.kts
            m3u8-ad-audio-collector/gradle/wrapper/gradle-wrapper.properties
            m3u8-ad-audio-probe/**/*.gradle.kts
            m3u8-ad-audio-probe/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Resolve build version
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version_name="${GITHUB_REF_NAME#v}"
            if [[ ! "$version_name" =~ ^[0-9]+([.][0-9]+){1,3}([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error title=Invalid release tag::Tag must look like v0.1.0"
              exit 1
            fi
            artifact_label="$version_name"
          else
            version_name="0.1.0-dev.${GITHUB_RUN_NUMBER}.${short_sha}"
            artifact_label="main-${GITHUB_RUN_NUMBER}-${short_sha}"
          fi
          echo "CI_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "CI_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "CI_ARTIFACT_LABEL=$artifact_label" >> "$GITHUB_ENV"

      - name: Test, lint and build three ABIs
        working-directory: m3u8-ad-audio-collector
        run: |
          ./gradlew \
            :app:testArm64_v8aDebugUnitTest \
            :app:lintArm64_v8aRelease \
            :app:assembleArm64_v8aRelease \
            :app:assembleArmeabi_v7aRelease \
            :app:assembleX86_64Release \
            -PciVersionCode="$CI_VERSION_CODE" \
            -PciVersionName="$CI_VERSION_NAME" \
            --stacktrace --no-daemon

      - name: Collect and verify signed APKs
        run: |
          mkdir -p release

          while IFS=: read -r flavor abi; do
            source_apk="m3u8-ad-audio-collector/app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            target_apk="release/m3u8-ad-audio-collector-$CI_ARTIFACT_LABEL-$abi.apk"
            if [[ ! -f "$source_apk" ]]; then
              echo "::error title=Missing APK::$source_apk was not generated"
              exit 1
            fi
            cp "$source_apk" "$target_apk"
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$target_apk"
          done <<'EOF'
          arm64_v8a:arm64-v8a
          armeabi_v7a:armeabi-v7a
          x86_64:x86_64
          EOF

          sha256sum release/*.apk > release/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-ad-audio-collector-${{ env.CI_ARTIFACT_LABEL }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Collector ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
